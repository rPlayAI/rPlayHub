# Linux CI — keeps the port honest: the RVRA-patched ffmpeg must build, the client must decode
# the committed reference capture clean, and the engine must compile against the modern
# libimobiledevice stack. Both deps builds are cached, so a warm run is minutes, not tens.
name: linux
on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config nasm libsdl2-dev
      - name: cache RVRA ffmpeg
        uses: actions/cache@v4
        with:
          path: deps/ffmpeg
          key: ffmpeg-rvra-${{ hashFiles('patches/ffmpeg-rvra.patch', 'scripts/build-ffmpeg-rvra.sh') }}
      - run: ./scripts/build-ffmpeg-rvra.sh
      - run: make -C client-c
      - name: cache gui deps
        uses: actions/cache@v4
        with:
          path: |
            deps/imgui
            deps/json
          key: gui-${{ hashFiles('scripts/fetch-gui-deps.sh') }}
      - run: ./scripts/fetch-gui-deps.sh && make -C client-c rplay-gui
      # The reference captures are device video and are not distributed with the source, so
      # this step checks the decoder only when they are present -- a local checkout that has
      # them still gets the regression, and CI stays honest about what it can actually verify.
      - name: decode the reference captures (RVRA on, must be clean) if present
        run: |
          set -eu
          ran=0
          check() {
            f="$1"; frames="$2"
            [ -f "$f" ] || { echo "skip: $f not in this checkout"; return 0; }
            RPLAY_RVRA=1 ./client-c/rplay-view --check -f "$f" 2>&1 | tee check.out
            grep -q "RVRA reference resampling enabled" check.out
            grep -q "decoded $frames" check.out
            grep -q "decode errors 0" check.out
            ran=$((ran + 1))
          }
          check reference/captures/gop-reproducer.h265 117
          check reference/captures/apple_video_REFERENCE.h265 601
          echo "reference decodes run: $ran"

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config autoconf automake libtool
          libssl-dev libcurl4-openssl-dev zlib1g-dev
      - run: git clone --branch STABLE-2_2_1_RELEASE https://github.com/lwip-tcpip/lwip.git deps/lwip
      - name: cache libimobiledevice stack
        uses: actions/cache@v4
        with:
          path: deps/imd
          key: imd-${{ hashFiles('scripts/build-imd-stack.sh') }}
      - run: '[ -f deps/imd/lib/libimobiledevice-1.0.so ] || ./scripts/build-imd-stack.sh'
      - run: make -C host-c IMD_PREFIX=$GITHUB_WORKSPACE/deps/imd
      # LD_LIBRARY_PATH is required: the engine is linked against the libimobiledevice stack
      # built into deps/imd, which is not on the default loader path, so the binary otherwise
      # dies with "libusbmuxd-2.0.so.7: cannot open shared object file" before printing a word.
      - name: smoke-run (no device, no usbmuxd — must start and say so, not crash)
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/deps/imd/lib:${LD_LIBRARY_PATH:-}"
          timeout 10 ./host-c/cdhost | tee run.out || true
          grep -q "usbmux" run.out
